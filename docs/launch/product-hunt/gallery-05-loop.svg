<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760">
  <rect width="1270" height="760" fill="#080b10"/>
  <text x="80" y="88" fill="#ff6258" font-family="monospace" font-size="14" letter-spacing="4">DELIBERATE PRACTICE / WITH RECEIPTS</text>
  <text x="80" y="160" fill="#f4f1eb" font-family="Arial, sans-serif" font-size="54" font-weight="700">One rep. One diagnosis. One next drill.</text>
  <g transform="translate(80 258)" font-family="Arial, sans-serif">
    <g><rect width="330" height="320" rx="24" fill="#0e131b" stroke="#343b46" stroke-width="2"/><text x="28" y="48" fill="#ff6258" font-family="monospace" font-size="14">01 / TAKE THE CALL</text><text x="28" y="106" fill="#f4f1eb" font-size="32" font-weight="700">Face the buyer.</text><text x="28" y="154" fill="#9297a0" font-size="18">Speak naturally while the</text><text x="28" y="182" fill="#9297a0" font-size="18">prospect interrupts, objects</text><text x="28" y="210" fill="#9297a0" font-size="18">and tests your control.</text><text x="28" y="282" fill="#686e77" font-family="monospace" font-size="12">VOICE → TRANSCRIPT</text></g>
    <path d="M348 160H390" stroke="#ff6258" stroke-width="3"/><path d="M380 151l10 9-10 9" fill="none" stroke="#ff6258" stroke-width="3"/>
    <g transform="translate(408)"><rect width="330" height="320" rx="24" fill="#0e131b" stroke="#343b46" stroke-width="2"/><text x="28" y="48" fill="#ff6258" font-family="monospace" font-size="14">02 / INSPECT THE TAPE</text><text x="28" y="106" fill="#f4f1eb" font-size="32" font-weight="700">See the break.</text><text x="28" y="154" fill="#9297a0" font-size="18">Five observable dimensions,</text><text x="28" y="182" fill="#9297a0" font-size="18">timestamped strengths and</text><text x="28" y="210" fill="#9297a0" font-size="18">the exact line that lost control.</text><text x="28" y="282" fill="#686e77" font-family="monospace" font-size="12">TRANSCRIPT → SCORECARD</text></g>
    <path d="M756 160H798" stroke="#ff6258" stroke-width="3"/><path d="M788 151l10 9-10 9" fill="none" stroke="#ff6258" stroke-width="3"/>
    <g transform="translate(816)"><rect width="330" height="320" rx="24" fill="#0e131b" stroke="#ff6258" stroke-width="2"/><text x="28" y="48" fill="#ff6258" font-family="monospace" font-size="14">03 / RUN THE DRILL</text><text x="28" y="106" fill="#f4f1eb" font-size="32" font-weight="700">Fix one thing.</text><text x="28" y="154" fill="#9297a0" font-size="18">Leave with a replacement line,</text><text x="28" y="182" fill="#9297a0" font-size="18">a focused practice drill and</text><text x="28" y="210" fill="#9297a0" font-size="18">a measurable success target.</text><text x="28" y="282" fill="#ff7d75" font-family="monospace" font-size="12">SCORECARD → NEXT REP</text></g>
  </g>
  <text x="80" y="650" fill="#f4f1eb" font-family="Arial, sans-serif" font-size="24" font-weight="700">No course. No streak theatre. Just the feedback loop.</text>
</svg>
